<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Interparlamentaria | Registro</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Header Verde Superior -->
    <header class="navbar-top">
        <div class="container-fluid px-4">
            <h5 class="m-0 fw-bold text-white">Comisión de Zonas Metropolitanas</h5>
        </div>
    </header>

    <!-- Contenido Principal con Contenido e Imagen Alineados -->
    <main class="container my-auto py-4">
        <div class="row align-items-center">
            
            <!-- Columna Izquierda: Información del Evento -->
            <div class="col-lg-7 col-md-8">
                <span class="subtitulo-camara">CÁMARA DE DIPUTADOS</span>
                <h1 class="titulo-portada mt-1 mb-3">
                    Mesa Interparlamentaria para la Gestión y Desarrollo de las Zonas Metropolitanas en México
                </h1>
                <p class="descripcion-portada mb-4">
                    Avances y Retos en materia territorial y urbano
                </p>

                <!-- Datos del Evento -->
                <div class="info-evento mb-4">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-calendar-event-fill icono-info me-3"></i>
                        <span>5 de agosto de 2026</span>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-clock-fill icono-info me-3"></i>
                        <span>10:00 - 15:00 hrs</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-geo-alt-fill icono-info me-3"></i>
                        <span>Palacio Legislativo de San Lázaro, Zona C, Edificio G</span>
                    </div>
                </div>

                <!-- Botón Registrarme -->
                <a href="registro.html" class="btn btn-registrarme">
                    Registrarme
                </a>
            </div>

            <!-- Columna Derecha: Logo de la Cámara -->
            <div class="col-lg-5 col-md-4 text-center text-md-end mt-4 mt-md-0">
                <img src="img/logo.png" alt="Logo Cámara de Diputados" class="img-logo-portada">            </div>

        </div>
    </main>

</body>

</html>
